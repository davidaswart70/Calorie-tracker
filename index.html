<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3ebdf" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1511" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Calories">
  <title>Calorie Tracker</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/glass.css">
  <script>
    // Apply the chosen theme (Profile → Theme) before anything is drawn, so it doesn't flash.
    try { document.documentElement.dataset.theme = localStorage.getItem('calorie-tracker-theme') || 'kitchen'; } catch (e) {}
  </script>
</head>
<body>
  <!-- Soft coloured shapes behind the glass -->
  <div class="backdrop" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
  </div>

  <main id="main"></main>

  <nav class="tabbar glass" aria-label="Sections">
    <span class="tab-indicator" aria-hidden="true"></span>
    <a href="#home" data-tab="home"><span class="tab-icon" data-icon="home"></span><span>Home</span></a>
    <a href="#fridge" data-tab="fridge"><span class="tab-icon" data-icon="fridge"></span><span>Fridge</span></a>
    <a href="#bar" data-tab="bar"><span class="tab-icon" data-icon="bar"></span><span>Bar</span></a>
    <a href="#cookbook" data-tab="cookbook"><span class="tab-icon" data-icon="book"></span><span>Cookbook</span></a>
    <a href="#reports" data-tab="reports"><span class="tab-icon" data-icon="chart"></span><span>Reports</span></a>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast" class="toast glass" role="status" aria-live="polite"></div>

  <script>
    // Fresh files on every open (see sw.js). The first time it takes over, reload once
    // so this visit already runs the latest version.
    if ('serviceWorker' in navigator) {
      const hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('sw.js').catch(() => {});
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (!hadController) location.reload(); });
    }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
