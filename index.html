<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef5ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c1410" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Calories">
  <title>Calorie Tracker</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Soft coloured shapes behind the glass -->
  <div class="backdrop" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
  </div>

  <main id="main"></main>

  <nav class="tabbar glass" aria-label="Sections">
    <span class="tab-indicator" aria-hidden="true"></span>
    <a href="#home" data-tab="home"><span class="tab-icon" data-icon="home"></span><span>Home</span></a>
    <a href="#fridge" data-tab="fridge"><span class="tab-icon" data-icon="fridge"></span><span>Fridge</span></a>
    <a href="#bar" data-tab="bar"><span class="tab-icon" data-icon="bar"></span><span>Bar</span></a>
    <a href="#cookbook" data-tab="cookbook"><span class="tab-icon" data-icon="book"></span><span>Cookbook</span></a>
    <a href="#reports" data-tab="reports"><span class="tab-icon" data-icon="chart"></span><span>Reports</span></a>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast" class="toast glass" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
